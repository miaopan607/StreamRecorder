[package]
name = "streamrecorder-desktop"
version = "1.0.0"
edition = "2021"

[lib]
test = false

[[bin]]
name = "StreamRecorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "net"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "deflate", "http2"] }
url = "2"
regex = "1"
base64 = "0.22"
md-5 = "0.10"
sm3 = "0.4"
ed25519-dalek = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
num-bigint = "0.4"
rand = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
rquickjs = "0.14"
wasmi = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
